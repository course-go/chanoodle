---
version: "2"

run:
  tests: true

linters:
  default: all
  disable:
    # restrictive
    - exhaustruct
    - exhaustruct_v5
    - varnamelen
    - funlen
    - nonamedreturns
    - gochecknoglobals
    - depguard
    # deprecated
    - wsl
    - gomodguard
  exclusions:
    rules:
      # repeated literals in table-driven tests read better than constants
      - path: _test\.go
        linters:
          - goconst
  settings:
    dupl:
      threshold: 400
    revive:
      rules:
        - name: package-comments
          disabled: true
    tagliatelle:
      case:
        overrides:
          - pkg: internal/config
            rules:
              yaml: snake

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
      # tag alignment is enforced by the tagalign linter
      reformat-tags: false

output:
  formats:
    text:
      path: stdout
    tab:
      path: golangci-lint.out
      colors: false
    html:
      path: golangci-lint.out.html
